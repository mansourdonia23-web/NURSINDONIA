<html lang="ar" dir="rtl">
<head>

  <style>
    :root {
      --primary: #0f766e;
      --primary-dark: #115e59;
      --accent: #b45309;
      --accent-light: #fef3c7;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --border: #cbd5e1;
      --success: #15803d;
      --success-bg: #dcfce7;
      --danger: #b91c1c;
      --danger-bg: #fee2e2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
    }

    header.brand-header {
      background: linear-gradient(135deg, #0f172a 0%, #0f766e 100%);
      color: #fff;
      padding: 28px 20px;
      border-bottom: 4px solid #f59e0b;
    }

    .brand-inner {
      max-width: 1120px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .brand-signature {
      font-size: 0.9rem;
      letter-spacing: 1px;
      background: rgba(255, 255, 255, 0.14);
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      font-weight: 700;
    }

    .brand-title h1 {
      font-size: 1.55rem;
      margin-bottom: 4px;
    }

    .brand-title p {
      color: #e2e8f0;
      font-size: 0.95rem;
    }

    .container {
      max-width: 1120px;
      margin: 24px auto;
      padding: 0 16px 48px;
    }

    .dept-nav {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 20px;
    }

    .dept-btn {
      background: var(--card);
      border: 1.5px solid var(--border);
      color: var(--text);
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: 0.2s;
    }

    .dept-btn:hover {
      border-color: var(--primary);
    }

    .dept-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .mode-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .mode-btn {
      padding: 10px 20px;
      border-radius: 8px;
      border: none;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.95rem;
    }

    .mode-btn.active {
      background: #0f172a;
      color: #fff;
    }

    .mode-btn:not(.active) {
      background: #e2e8f0;
      color: var(--text);
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.05);
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 14px;
      margin-bottom: 20px;
    }

    .qa-card {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 14px;
      background: #f8fafc;
    }

    .qa-q {
      font-weight: 700;
      color: var(--primary-dark);
      margin-bottom: 8px;
    }

    .qa-a {
      color: var(--text);
      background: #fff;
      padding: 12px;
      border-radius: 8px;
      border-right: 4px solid var(--primary);
    }

    .quiz-option {
      display: block;
      width: 100%;
      text-align: right;
      padding: 12px 16px;
      margin-bottom: 10px;
      background: #fff;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.98rem;
    }

    .quiz-option:hover {
      border-color: var(--primary);
    }

    .quiz-option.selected {
      background: #ccfbf1;
      border-color: var(--primary);
      font-weight: 700;
    }

    .action-btn {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 11px 22px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.98rem;
    }

    .action-btn:hover {
      background: var(--primary-dark);
    }

    .score-box {
      padding: 18px;
      border-radius: 10px;
      background: var(--accent-light);
      border: 1px solid #f59e0b;
      margin-top: 18px;
      font-weight: 700;
    }

    .feedback-correct {
      color: var(--success);
      background: var(--success-bg);
      padding: 10px;
      border-radius: 8px;
      margin-top: 8px;
      font-weight: 600;
    }

    .feedback-wrong {
      color: var(--danger);
      background: var(--danger-bg);
      padding: 10px;
      border-radius: 8px;
      margin-top: 8px;
      font-weight: 600;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: var(--muted);
      font-size: 0.9rem;
    }
  </style>
</head>

            options: [
              "إكمال باقي الجرعة ببطء",
              "إيقاف الدواء فوراً، تقييم المريض، واستدعاء الطبيب وتجهيز طوارئ التحسس",
              "تأجيل الإبلاغ لنهاية المناوبة",
              "إعطاء ماء عن طريق الفم فوراً دون تقييم"
            ],
            answer: 1
          },
          {
            q: "كيف نتحقق من فعالية دورة التعقيم في جهاز الأوتوكلاف؟",
            options: [
              "بالنظر إلى شكل العبوة فقط",
              "عبر المؤشرات الفيزيائية والكيميائية والبيولوجية المعتمدة وسجلات التعقيم",
              "بلمس الكيس بعد خروجه مباشرة",
              "بتقليل زمن الدورة لتوفير الوقت"
            ],
            answer: 1
          },
          {
            q: "ما القاعدة الصحيحة لتوثيق إجراء تمريضي أو دوائي؟",
            options: [
              "توثيقه قبل تنفيذه بساعة",
              "توثيقه بدقة ووضوح بعد تنفيذه مباشرة مع ذكر الوقت والملاحظات",
              "تركه دون توقيع أو اسم المستخدم",
              "نسخ ملاحظة يوم سابق"
            ],
            answer: 1
          }
        ]
      }
    };

    let currentDept = "infection";
    let currentMode = "guide";
    let userSelections = {};

    function renderNav() {
      const nav = document.getElementById("deptNav");
      nav.innerHTML = "";
      Object.entries(hospitalData).forEach(([key, dept]) => {
        const btn = document.createElement("button");
        btn.className = `dept-btn ${key === currentDept ? "active" : ""}`;
        btn.textContent = dept.title;
        btn.onclick = () => {
          currentDept = key;
          renderNav();
          renderPanel();
        };
        nav.appendChild(btn);
      });
    }

    function setMode(mode) {
      currentMode = mode;
      document.getElementById("btnGuide").classList.toggle("active", mode === "guide");
      document.getElementById("btnQuiz").classList.toggle("active", mode === "quiz");
      renderPanel();
    }

    function renderPanel() {
      const panel = document.getElementById("mainPanel");
      const dept = hospitalData[currentDept];

      if (currentMode === "guide") {
        let html = `
          <div class="panel-header">
            <h2>${dept.title} — أسئلة المقابلة وإجاباتها النموذجية</h2>
            <span style="color: var(--muted); font-weight: 600;">تصميم DUNYA MANSOUR</span>
          </div>
        `;
        dept.qa.forEach((item, idx) => {
          html += `
            <div class="qa-card">
              <div class="qa-q">${idx + 1}. ${item.q}</div>
              <div class="qa-a"><strong>الإجابة النموذجية:</strong> ${item.a}</div>
            </div>
          `;
        });
        panel.innerHTML = html;
      } else {
        const deptAns = userSelections[currentDept] || {};
        let html = `
          <div class="panel-header">
            <h2>اختبار قسم: ${dept.title}</h2>
            <span style="color: var(--muted); font-weight: 600;">اختر الإجابة الصحيحة لكل سؤال</span>
          </div>
        `;
        dept.quiz.forEach((qItem, qIdx) => {
          html += `<div class="qa-card"><div class="qa-q">${qIdx + 1}. ${qItem.q}</div>`;
          qItem.options.forEach((opt, oIdx) => {
            const selected = deptAns[qIdx] === oIdx ? "selected" : "";
            html += `
              <button type="button" class="quiz-option ${selected}" onclick="chooseAnswer('${currentDept}', ${qIdx}, ${oIdx})">
                ${opt}
              </button>
            `;
          });
          html += `</div>`;
        });
        html += `
          <button type="button" class="action-btn" onclick="gradeQuiz('${currentDept}')">عرض النتيجة والتصحيح</button>
          <div id="quizResultBox"></div>
        `;
        panel.innerHTML = html;
      }
    }

    function chooseAnswer(deptKey, qIdx, oIdx) {
      if (!userSelections[deptKey]) userSelections[deptKey] = {};
      userSelections[deptKey][qIdx] = oIdx;
      renderPanel();
    }

    function gradeQuiz(deptKey) {
      const dept = hospitalData[deptKey];
      const deptAns = userSelections[deptKey] || {};
      let correctCount = 0;
      let detailsHtml = "";

      dept.quiz.forEach((qItem, idx) => {
        const chosen = deptAns[idx];
        if (chosen === qItem.answer) {
          correctCount++;
          detailsHtml += `<div class="feedback-correct">السؤال ${idx + 1}: إجابة صحيحة ✔</div>`;
        } else {
          detailsHtml += `
            <div class="feedback-wrong">
              السؤال ${idx + 1}: غير مكتملة أو خاطئة ✘ — الإجابة الصحيحة: ${qItem.options[qItem.answer]}
            </div>
          `;
        }
      });

      const pct = Math.round((correctCount / dept.quiz.length) * 100);
      document.getElementById("quizResultBox").innerHTML = `
        <div class="score-box">
          نتيجتك في قسم (${dept.title}): ${correctCount} من ${dept.quiz.length} (${pct}%)
          ${detailsHtml}
        </div>
      `;
    }

    renderNav();
    renderPanel();
  </script>
</body>
</html>
